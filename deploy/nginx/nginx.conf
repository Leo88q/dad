worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr crit;
events {
    worker_connections 1024;
    multi_accept off;
}
http {
    server_tokens off;
    default_type application/octet-stream;
    # No IP, URL, query, bearer, invitation or user agent in request logs.
    log_format protection '$time_iso8601 status=$status duration=$request_time quota=$limit_req_status';
    access_log /dev/stdout protection buffer=32k flush=5s;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    limit_req_zone $binary_remote_addr zone=client:10m rate=30r/s;
    limit_req_zone $server_name zone=service:1m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api_client:10m rate=5r/s;
    limit_req_zone $server_name zone=api_service:1m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_conn_zone $server_name zone=service_connections:1m;
    limit_req_status 429;
    limit_conn_status 503;
    upstream application {
        server app:3000;
        keepalive 32;
    }
    server {
        listen 8080;
        server_name _;
        # Only the TLS proxy is on this network. Never trust arbitrary XFF.
        set_real_ip_from 172.28.0.0/24;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;
        limit_conn client_connections 20;
        limit_conn service_connections 1024;
        error_page 429 /edge-errors/429.json;
        error_page 503 /edge-errors/503.json;
        error_page 413 /edge-errors/413.json;
        location = /edge-errors/429.json {
            internal;
            alias /etc/nginx/errors/429.json;
            default_type application/json;
            add_header Retry-After 2 always;
            add_header X-Ryadom-Protection edge-rate always;
            add_header Cache-Control no-store always;
        }
        location = /edge-errors/503.json {
            internal;
            alias /etc/nginx/errors/503.json;
            default_type application/json;
            add_header Retry-After 5 always;
            add_header X-Ryadom-Protection edge-capacity always;
            add_header Cache-Control no-store always;
        }
        location = /edge-errors/413.json {
            internal;
            alias /etc/nginx/errors/413.json;
            default_type application/json;
            add_header X-Ryadom-Protection edge-body always;
            add_header Cache-Control no-store always;
        }
        location = /edge-health {
            include /etc/nginx/request-limits.conf;
            alias /etc/nginx/health.json;
            default_type application/json;
            access_log off;
        }
        location /api/max/auth {
            include /etc/nginx/api-limits.conf;
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/upstream.conf;
        }
        location /api/recover {
            include /etc/nginx/api-limits.conf;
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/upstream.conf;
        }
        location /api/connect-device {
            include /etc/nginx/api-limits.conf;
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/upstream.conf;
        }
        location /api/ {
            include /etc/nginx/api-limits.conf;
            include /etc/nginx/upstream.conf;
        }
        location / {
            include /etc/nginx/request-limits.conf;
            include /etc/nginx/upstream.conf;
        }
    }
}
