name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:load
      - run: npm run test:edge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            .cache/edge/*.log
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build -t ryadom:ci .
      - name: Validate TLS proxy and isolated edge configurations
        run: |
          docker network create ryadom-edge-check
          docker run -d --name app --network ryadom-edge-check --env NODE_ENV=test ryadom:ci
          docker run --rm --network ryadom-edge-check --user 101:101 --read-only --tmpfs /tmp --cap-drop ALL --entrypoint nginx -v "$PWD/deploy/nginx:/etc/nginx:ro" nginx:1.30.6-alpine -t
          docker run -d --name ryadom-edge -p 127.0.0.1:3301:8080 --network ryadom-edge-check --user 101:101 --read-only --tmpfs /tmp --cap-drop ALL --entrypoint nginx -v "$PWD/deploy/nginx:/etc/nginx:ro" nginx:1.30.6-alpine -g 'daemon off;'
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3301/edge-health
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3301/readyz
          docker run --rm --network none -e APP_DOMAIN=ci.ryadom.invalid -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Refuse an unconfigured production launch
        run: |
          if docker run --rm ryadom:ci; then
            echo "Unconfigured production image must fail closed"
            exit 1
          fi
      - name: Exercise image and encrypted backup without real MAX credentials
        run: |
          docker run -d --name ryadom-smoke --env NODE_ENV=test -p 127.0.0.1:3300:3000 ryadom:ci
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3300/readyz
          docker exec ryadom-smoke node scripts/backup-key.js /tmp/backup-key
          docker exec -e BACKUP_KEY_FILE=/tmp/backup-key -e BACKUP_DIR=/tmp/encrypted ryadom-smoke node scripts/encrypted-backup.js
          docker exec -e BACKUP_DIR=/tmp/encrypted ryadom-smoke node scripts/backup-health.js
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs app || true
          docker logs ryadom-edge || true
          docker rm -f ryadom-edge app || true
          docker network rm ryadom-edge-check || true
          docker logs ryadom-smoke || true
          docker rm -f ryadom-smoke || true
